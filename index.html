<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XREZZKY — Official Profile</title>
<meta name="description" content="XREZZKY — Digital Creator & Developer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAROygETfPpumimu-Vue_PLABWWf-hZ_Pc",
    authDomain: "communityxrezzkyofficalstore.firebaseapp.com",
    projectId: "communityxrezzkyofficalstore",
    storageBucket: "communityxrezzkyofficalstore.firebasestorage.app",
    messagingSenderId: "564881988767",
    appId: "1:564881988767:web:875d7baf6d7f7191e316aa",
    databaseURL: "https://communityxrezzkyofficalstore-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const DEFAULT = {
    profile: { name:"XREZZKY", tagline:"Digital Creator & Developer", bio:"Halo! Gw XREZZKY — builder, developer, dan digital entrepreneur. Gw bikin tools, marketplace, dan solusi digital yang berguna buat komunitas.", avatarUrl:"", bannerUrl:"", badge:"✦ Verified Creator", location:"Indonesia 🇮🇩", joinYear:"2021" },
    stats: [{ label:"Pengguna", value:"10.2K+", icon:"👥" },{ label:"Transaksi", value:"2.5K+", icon:"🛡️" },{ label:"Rating", value:"4.9/5", icon:"⭐" },{ label:"Proyek", value:"30+", icon:"🚀" }],
    links: [{ label:"WhatsApp CS", url:"#", icon:"💬", color:"#25D366" },{ label:"Telegram", url:"#", icon:"✈️", color:"#229ED9" },{ label:"Instagram", url:"#", icon:"📸", color:"#E1306C" },{ label:"Discord", url:"#", icon:"🎮", color:"#5865F2" },{ label:"YouTube", url:"#", icon:"▶️", color:"#FF0000" },{ label:"TikTok", url:"#", icon:"🎵", color:"#ffffff" }],
    services: [{ title:"Marketplace", desc:"Beli & jual produk digital dengan aman", icon:"🏪" },{ title:"Middleman (MC)", desc:"Escrow aman, dana ditahan sampai selesai", icon:"🛡️" },{ title:"Deposit Balance", desc:"Isi saldo untuk kemudahan transaksi", icon:"💳" },{ title:"CS 24/7", desc:"Support aktif siap membantu kapan saja", icon:"🎧" }],
    announcements: [{ tag:"Promo", text:"Cashback MC 10% untuk semua transaksi — berlaku s/d 30 Nov!", time:"2 jam lalu", color:"#a855f7" },{ tag:"Update", text:"Sistem Deposit berhasil menambahkan metode pembayaran baru.", time:"5 jam lalu", color:"#3b82f6" },{ tag:"Info", text:"Jasa delay garansi 24 jam untuk pengguna yang menggunakan MC.", time:"1 hari lalu", color:"#f59e0b" }],
    theme: { accentColor:"#7c3aed", accentSecondary:"#3b82f6", bgPrimary:"#0a0a0f", bgCard:"#111118" },
    footer: { copy:"© 2025 XREZZKY OFFICIAL STORE — All Rights Reserved.", tagline:"Trusted · Aman · Cepat · Profesional" }
  };

  function el(id){ return document.getElementById(id); }

  function applyData(data) {
    const d = {...DEFAULT,...data};
    const p = {...DEFAULT.profile,...(d.profile||{})};
    el('profile-name').textContent = p.name;
    el('profile-tagline').textContent = p.tagline;
    el('profile-bio').textContent = p.bio;
    el('profile-badge').textContent = p.badge;
    el('profile-location').textContent = p.location;
    el('profile-join').textContent = `Bergabung ${p.joinYear}`;
    if(p.avatarUrl) el('profile-avatar').src = p.avatarUrl;
    if(p.bannerUrl){ el('banner-bg').style.backgroundImage=`url(${p.bannerUrl})`; el('banner-bg').style.backgroundSize='cover'; el('banner-bg').style.backgroundPosition='center'; }

    const stats = d.stats||DEFAULT.stats;
    el('stats-grid').innerHTML = stats.map(s=>`
      <div class="stat-card">
        <span class="stat-icon">${s.icon}</span>
        <span class="stat-value">${s.value}</span>
        <span class="stat-label">${s.label}</span>
      </div>`).join('');

    const links = d.links||DEFAULT.links;
    el('links-grid').innerHTML = links.map(l=>`
      <a href="${l.url}" class="link-btn" target="_blank" style="--lc:${l.color}">
        <span class="link-icon">${l.icon}</span><span>${l.label}</span>
        <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </a>`).join('');

    const services = d.services||DEFAULT.services;
    el('services-grid').innerHTML = services.map(s=>`
      <div class="service-card">
        <div class="service-icon">${s.icon}</div>
        <div><div class="service-title">${s.title}</div><div class="service-desc">${s.desc}</div></div>
      </div>`).join('');

    const anns = d.announcements||DEFAULT.announcements;
    el('ann-list').innerHTML = anns.map(a=>`
      <div class="ann-item">
        <span class="ann-tag" style="background:${a.color}22;color:${a.color};border-color:${a.color}44">${a.tag}</span>
        <span class="ann-text">${a.text}</span>
        <span class="ann-time">${a.time}</span>
      </div>`).join('');

    const f = {...DEFAULT.footer,...(d.footer||{})};
    el('footer-copy').textContent = f.copy;
    el('footer-tagline').textContent = f.tagline;

    const t = {...DEFAULT.theme,...(d.theme||{})};
    document.documentElement.style.setProperty('--accent', t.accentColor);
    document.documentElement.style.setProperty('--accent2', t.accentSecondary);
    document.documentElement.style.setProperty('--bg', t.bgPrimary);
    document.documentElement.style.setProperty('--card', t.bgCard);
  }

  applyData(DEFAULT);
  onValue(ref(db,'siteData'), snap => { if(snap.exists()) applyData(snap.val()); });
</script>

<style>
:root{--accent:#7c3aed;--accent2:#3b82f6;--bg:#0a0a0f;--card:#111118;--card2:#16161f;--border:rgba(255,255,255,0.06);--text:#e8e8f0;--muted:#6b6b80;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--radius:16px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--font-display);font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
main{padding-top:60px;max-width:900px;margin:0 auto;padding-left:20px;padding-right:20px}
.hero{position:relative;margin-top:24px;border-radius:24px;overflow:hidden;border:1px solid var(--border)}
#banner-bg{height:180px;background:linear-gradient(135deg,#1a0a2e 0%,#0f1629 50%,#0a1520 100%);position:relative}
#banner-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--card) 100%)}
#banner-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 20% 50%,rgba(124,58,237,0.2) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 80% 30%,rgba(59,130,246,0.15) 0%,transparent 70%)}
.hero-body{background:var(--card);padding:0 28px 28px}
.profile-row{display:flex;align-items:flex-end;gap:20px;margin-top:-44px;position:relative;z-index:2}
.avatar-wrap{position:relative;flex-shrink:0}
#profile-avatar{width:88px;height:88px;border-radius:50%;border:3px solid var(--card);object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));display:block}
.avatar-ring{position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));z-index:-1;opacity:0.6}
.profile-meta{padding-bottom:4px;flex:1}
.profile-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;margin-bottom:6px}
#profile-name{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.1}
#profile-tagline{font-size:14px;color:var(--muted);margin-top:2px}
.profile-info-row{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.profile-chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
#profile-bio{margin-top:16px;font-size:14px;line-height:1.7;color:rgba(232,232,240,0.75);max-width:600px}
.section{margin-top:20px}
.section-label{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
#stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;transition:all 0.2s}
.stat-card:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.1)}
.stat-icon{font-size:20px;display:block;margin-bottom:6px}
.stat-value{display:block;font-family:var(--font-display);font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.7) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(124,58,237,0.3),transparent)}
.card-title{font-family:var(--font-display);font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
#links-grid{display:flex;flex-direction:column;gap:8px}
.link-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px;font-weight:500;transition:all 0.2s;position:relative;overflow:hidden}
.link-btn::before{content:'';position:absolute;inset:0;background:var(--lc,var(--accent));opacity:0;transition:opacity 0.2s}
.link-btn:hover::before{opacity:0.07}
.link-btn:hover{border-color:var(--lc,var(--accent));transform:translateX(3px)}
.link-icon{font-size:16px;flex-shrink:0}
.link-btn span:nth-child(2){flex:1}
.link-arrow{width:14px;height:14px;opacity:0.4;transition:all 0.2s}
.link-btn:hover .link-arrow{opacity:1;transform:translate(2px,-2px)}
#services-grid{display:flex;flex-direction:column;gap:10px}
.service-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--card2);border:1px solid var(--border);transition:all 0.2s}
.service-card:hover{border-color:rgba(124,58,237,0.3)}
.service-icon{width:40px;height:40px;border-radius:10px;background:rgba(124,58,237,0.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.service-title{font-size:13px;font-weight:600}
.service-desc{font-size:12px;color:var(--muted);margin-top:1px}
#ann-list{display:flex;flex-direction:column;gap:10px}
.ann-item{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;flex-wrap:wrap}
.ann-tag{flex-shrink:0;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.5px;border:1px solid;margin-top:1px}
.ann-text{flex:1;color:rgba(232,232,240,0.8);min-width:120px}
.ann-time{font-size:11px;color:var(--muted);flex-shrink:0;margin-top:2px}
footer{margin-top:32px;margin-bottom:20px;border-top:1px solid var(--border);padding-top:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
#footer-copy,#footer-tagline{font-size:12px;color:var(--muted)}
.footer-brand{font-size:12px;color:var(--muted)}
.footer-brand span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
.accent-glow{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none;z-index:0}
@media(max-width:640px){.nav{padding:0 16px}main{padding-left:14px;padding-right:14px}#stats-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.hero-body{padding:0 18px 22px}#profile-name{font-size:22px}}
</style>
</head>
<body>
<div class="accent-glow"></div>
<nav class="nav">
  <div class="nav-logo">XREZZKY</div>
</nav>
<main>
  <div class="hero">
    <div id="banner-bg"></div>
    <div class="hero-body">
      <div class="profile-row">
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <img id="profile-avatar" src="https://ui-avatars.com/api/?name=XREZZKY&background=7c3aed&color=fff&size=200&bold=true" alt="Avatar">
        </div>
        <div class="profile-meta">
          <div class="profile-badge" id="profile-badge">✦ Verified Creator</div>
          <h1 id="profile-name">XREZZKY</h1>
          <div id="profile-tagline">Digital Creator & Developer</div>
        </div>
      </div>
      <div class="profile-info-row">
        <div class="profile-chip">📍 <span id="profile-location">Indonesia 🇮🇩</span></div>
        <div class="profile-chip">📅 <span id="profile-join">Bergabung 2021</span></div>
      </div>
      <p id="profile-bio">Halo! Gw XREZZKY — builder, developer, dan digital entrepreneur.</p>
    </div>
  </div>
  <div class="section">
    <div class="section-label">Overview</div>
    <div id="stats-grid"></div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-title"><div class="card-title-dot"></div> Social & Links</div>
      <div id="links-grid"></div>
    </div>
    <div class="card">
      <div class="card-title"><div class="card-title-dot"></div> Layanan</div>
      <div id="services-grid"></div>
    </div>
  </div>
  <div class="card" style="margin-top:20px">
    <div class="card-title"><div class="card-title-dot"></div> Pengumuman Terbaru</div>
    <div id="ann-list"></div>
  </div>
  <footer>
    <div id="footer-copy"></div>
    <div id="footer-tagline"></div>
    <div class="footer-brand">Made with ❤ by <span>XREZZKY</span></div>
  </footer>
</main>
</body>
</html>
